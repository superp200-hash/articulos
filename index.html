const q=document.getElementById('q'), results=document.getElementById('results'), count=document.getElementById('count');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function score(item, terms){let t=norm(item.text), s=0; for(const x of terms){if(t.includes(x)) s+=x.length*3; else return -1} if(norm(item.parent).startsWith(terms[0]))s+=30; return s}
function hi(s, query){let terms=query.trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); if(!terms.length)return s; let re=new RegExp('('+terms.join('|')+')','gi'); return s.replace(re,'<mark>$1</mark>')}
function render(){let query=q.value.trim(); if(!query){count.textContent=data.length+' líneas indexadas'; results.innerHTML='<div class="empty">Empieza a escribir para buscar en todo el catálogo.</div>';return}
let terms=norm(query).split(/\s+/).filter(Boolean); let arr=data.map(x=>({x,s:score(x,terms)})).filter(a=>a.s>=0).sort((a,b)=>b.s-a.s).map(a=>a.x);
count.textContent=arr.length+' resultado'+(arr.length===1?'':'s');
results.innerHTML=arr.slice(0,200).map(x=>`<div class="card"><div class="parent">${hi(x.parent,query)}</div><div class="detail">${hi(x.detail,query)}</div><div class="row">Fila original: ${x.row}</div></div>`).join('') || '<div class="empty">No hay coincidencias.</div>';
}
q.addEventListener('input',render); render();
