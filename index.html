const q=document.getElementById('q'),results=document.getElementById('results'),count=document.getElementById('count');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function compact(s){return norm(s).replace(/ /g,'')}
function score(x,terms){const t=norm(x.text), tc=compact(x.text);let s=0;for(const term of terms){if(!t.includes(term) && !tc.includes(compact(term)))return -1;s+=term.length*3}if(norm(x.parent).startsWith(terms[0])||compact(x.parent).startsWith(compact(terms[0])))s+=30;return s}
function hi(s,query){const ts=query.trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));if(!ts.length)return s;return s.replace(new RegExp('('+ts.join('|')+')','gi'),'<mark>$1</mark>')}
function render(){const query=q.value.trim();if(!query){count.textContent=data.length+' líneas indexadas';results.innerHTML='<div class="empty">Empieza a escribir para buscar en todo el catálogo.</div>';return}const terms=norm(query).split(/\s+/).filter(Boolean);const arr=data.map(x=>({x,s:score(x,terms)})).filter(a=>a.s>=0).sort((a,b)=>b.s-a.s).map(a=>a.x);count.textContent=arr.length+' resultado'+(arr.length===1?'':'s');results.innerHTML=arr.slice(0,300).map(x=>`<div class="card"><div class="parent">${hi(x.parent,query)}</div><div class="detail">${hi(x.detail,query)}</div><div class="row">Fila original: ${x.row}</div></div>`).join('')||'<div class="empty">No hay coincidencias.</div>'}
q.addEventListener('input',render);render();
